version: "3.8"

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: planvista3d_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CORS_ORIGIN=*
      - BLENDER_PATH=/usr/bin/blender
    volumes:
      - planvista_uploads:/app/backend/model-generation/uploads
      - planvista_outputs:/app/backend/model-generation/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        - VITE_API_BASE_URL=
        - VITE_PUTER_WORKER_URL=https://planvista-3d.puter.work
    container_name: planvista3d_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  planvista_uploads:
    driver: local
  planvista_outputs:
    driver: local
